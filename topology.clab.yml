name: mrc-fabric
mgmt:
  network: mrc-mgmt
  ipv4-subnet: 172.20.0.0/24
topology:
  nodes:
    p0-spine0:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p0-spine0.cfg
    p0-spine1:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p0-spine1.cfg
    p0-leaf0:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p0-leaf0.cfg
    p0-leaf1:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p0-leaf1.cfg
    p0-leaf2:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p0-leaf2.cfg
    p0-leaf3:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p0-leaf3.cfg
    p1-spine0:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p1-spine0.cfg
    p1-spine1:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p1-spine1.cfg
    p1-leaf0:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p1-leaf0.cfg
    p1-leaf1:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p1-leaf1.cfg
    p1-leaf2:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p1-leaf2.cfg
    p1-leaf3:
      kind: ceos
      image: ceos:4.36.0.1F
      image-pull-policy: Never
      startup-config: configs/p1-leaf3.cfg
    host0:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      binds:
      - configs/host0-startup.sh:/startup.sh
      exec:
      - bash /startup.sh
    host1:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      binds:
      - configs/host1-startup.sh:/startup.sh
      exec:
      - bash /startup.sh
    host2:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      binds:
      - configs/host2-startup.sh:/startup.sh
      exec:
      - bash /startup.sh
    host3:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      binds:
      - configs/host3-startup.sh:/startup.sh
      exec:
      - bash /startup.sh
    controller:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
  links:
  - endpoints:
    - p0-leaf0:eth1
    - p0-spine0:eth1
  - endpoints:
    - p0-leaf0:eth2
    - p0-spine1:eth1
  - endpoints:
    - p0-leaf1:eth1
    - p0-spine0:eth2
  - endpoints:
    - p0-leaf1:eth2
    - p0-spine1:eth2
  - endpoints:
    - p0-leaf2:eth1
    - p0-spine0:eth3
  - endpoints:
    - p0-leaf2:eth2
    - p0-spine1:eth3
  - endpoints:
    - p0-leaf3:eth1
    - p0-spine0:eth4
  - endpoints:
    - p0-leaf3:eth2
    - p0-spine1:eth4
  - endpoints:
    - p0-leaf0:eth3
    - host0:eth1
  - endpoints:
    - p0-leaf1:eth3
    - host1:eth1
  - endpoints:
    - p0-leaf2:eth3
    - host2:eth1
  - endpoints:
    - p0-leaf3:eth3
    - host3:eth1
  - endpoints:
    - p1-leaf0:eth1
    - p1-spine0:eth1
  - endpoints:
    - p1-leaf0:eth2
    - p1-spine1:eth1
  - endpoints:
    - p1-leaf1:eth1
    - p1-spine0:eth2
  - endpoints:
    - p1-leaf1:eth2
    - p1-spine1:eth2
  - endpoints:
    - p1-leaf2:eth1
    - p1-spine0:eth3
  - endpoints:
    - p1-leaf2:eth2
    - p1-spine1:eth3
  - endpoints:
    - p1-leaf3:eth1
    - p1-spine0:eth4
  - endpoints:
    - p1-leaf3:eth2
    - p1-spine1:eth4
  - endpoints:
    - p1-leaf0:eth3
    - host0:eth2
  - endpoints:
    - p1-leaf1:eth3
    - host1:eth2
  - endpoints:
    - p1-leaf2:eth3
    - host2:eth2
  - endpoints:
    - p1-leaf3:eth3
    - host3:eth2
