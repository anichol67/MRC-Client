name: mrcfabric
mgmt:
  network: mrcmgmt
  ipv4-subnet: 172.20.0.0/24
topology:
  nodes:
    p0spine0:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p0spine0.cfg
      mgmt-ipv4: 172.20.0.11
    p0spine1:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p0spine1.cfg
      mgmt-ipv4: 172.20.0.12
    p0leaf0:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p0leaf0.cfg
      mgmt-ipv4: 172.20.0.21
    p0leaf1:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p0leaf1.cfg
      mgmt-ipv4: 172.20.0.22
    p0leaf2:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p0leaf2.cfg
      mgmt-ipv4: 172.20.0.23
    p0leaf3:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p0leaf3.cfg
      mgmt-ipv4: 172.20.0.24
    p1spine0:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p1spine0.cfg
      mgmt-ipv4: 172.20.0.31
    p1spine1:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p1spine1.cfg
      mgmt-ipv4: 172.20.0.32
    p1leaf0:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p1leaf0.cfg
      mgmt-ipv4: 172.20.0.41
    p1leaf1:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p1leaf1.cfg
      mgmt-ipv4: 172.20.0.42
    p1leaf2:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p1leaf2.cfg
      mgmt-ipv4: 172.20.0.43
    p1leaf3:
      kind: ceos
      image: arista/ceos:latest
      image-pull-policy: Never
      startup-config: configs/p1leaf3.cfg
      mgmt-ipv4: 172.20.0.44
    host0:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      mgmt-ipv4: 172.20.0.51
      binds:
      - configs/host0startup.sh:/startup.sh
      cmd: bash -c "bash /startup.sh; sleep infinity"
    host1:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      mgmt-ipv4: 172.20.0.52
      binds:
      - configs/host1startup.sh:/startup.sh
      cmd: bash -c "bash /startup.sh; sleep infinity"
    host2:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      mgmt-ipv4: 172.20.0.53
      binds:
      - configs/host2startup.sh:/startup.sh
      cmd: bash -c "bash /startup.sh; sleep infinity"
    host3:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      mgmt-ipv4: 172.20.0.54
      binds:
      - configs/host3startup.sh:/startup.sh
      cmd: bash -c "bash /startup.sh; sleep infinity"
    controller:
      kind: linux
      image: ghcr.io/anichol67/mrc-emu:latest
      mgmt-ipv4: 172.20.0.100
      ports:
      - "3080:8080"
      env:
        URL_PREFIX: /proxy/3080
      cmd: bash -c "/usr/sbin/sshd 2>/dev/null; cd /app && python3 app.py"
  links:
  - endpoints:
    - p0leaf0:eth1
    - p0spine0:eth1
  - endpoints:
    - p0leaf0:eth2
    - p0spine1:eth1
  - endpoints:
    - p0leaf1:eth1
    - p0spine0:eth2
  - endpoints:
    - p0leaf1:eth2
    - p0spine1:eth2
  - endpoints:
    - p0leaf2:eth1
    - p0spine0:eth3
  - endpoints:
    - p0leaf2:eth2
    - p0spine1:eth3
  - endpoints:
    - p0leaf3:eth1
    - p0spine0:eth4
  - endpoints:
    - p0leaf3:eth2
    - p0spine1:eth4
  - endpoints:
    - p0leaf0:eth3
    - host0:eth1
  - endpoints:
    - p0leaf1:eth3
    - host1:eth1
  - endpoints:
    - p0leaf2:eth3
    - host2:eth1
  - endpoints:
    - p0leaf3:eth3
    - host3:eth1
  - endpoints:
    - p1leaf0:eth1
    - p1spine0:eth1
  - endpoints:
    - p1leaf0:eth2
    - p1spine1:eth1
  - endpoints:
    - p1leaf1:eth1
    - p1spine0:eth2
  - endpoints:
    - p1leaf1:eth2
    - p1spine1:eth2
  - endpoints:
    - p1leaf2:eth1
    - p1spine0:eth3
  - endpoints:
    - p1leaf2:eth2
    - p1spine1:eth3
  - endpoints:
    - p1leaf3:eth1
    - p1spine0:eth4
  - endpoints:
    - p1leaf3:eth2
    - p1spine1:eth4
  - endpoints:
    - p1leaf0:eth3
    - host0:eth2
  - endpoints:
    - p1leaf1:eth3
    - host1:eth2
  - endpoints:
    - p1leaf2:eth3
    - host2:eth2
  - endpoints:
    - p1leaf3:eth3
    - host3:eth2
