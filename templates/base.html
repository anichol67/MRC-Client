<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MRC emu{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-link.active { font-weight: bold; }
        .badge-good { background-color: #198754; }
        .badge-skip { background-color: #ffc107; color: #000; }
        .badge-denied { background-color: #dc3545; }
        .badge-bad { background-color: #6c757d; }
        .hex-dump { font-family: 'Courier New', monospace; font-size: 0.85rem; white-space: pre; }
        .bitmap-bit { display: inline-block; width: 12px; height: 18px; text-align: center;
                      font-family: monospace; font-size: 0.75rem; border: 1px solid #444; margin: 1px; }
        .bitmap-bit.set { background-color: #198754; color: #fff; }
        .bitmap-bit.unset { background-color: #2c2c2c; color: #666; }
        .card { margin-bottom: 1rem; }
        .mode-badge { font-size: 0.7rem; vertical-align: middle; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MRC emu
                {% if config.get('OFFLINE_MODE', False) %}
                <span class="badge bg-warning text-dark mode-badge">OFFLINE</span>
                {% else %}
                <span class="badge bg-success mode-badge">LIVE</span>
                {% endif %}
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <div class="navbar-nav">
                    <a class="nav-link {% if request.path == '/' or request.path == '/host' %}active{% endif %}" href="/host">Host</a>
                    <a class="nav-link {% if request.path == '/network' %}active{% endif %}" href="/network">Network</a>
                    <a class="nav-link {% if request.path == '/ev' %}active{% endif %}" href="/ev">EV Profiles</a>
                    <a class="nav-link {% if request.path == '/qp' %}active{% endif %}" href="/qp">Queue Pairs</a>
                    <a class="nav-link {% if request.path == '/packets' %}active{% endif %}" href="/packets">Packets</a>
                    <a class="nav-link {% if request.path == '/cc' %}active{% endif %}" href="/cc">CC</a>
                    <a class="nav-link {% if request.path == '/probing' %}active{% endif %}" href="/probing">Probing</a>
                    <a class="nav-link {% if request.path == '/topology' %}active{% endif %}" href="/topology">Topology</a>
                    <a class="nav-link {% if request.path == '/topology_viz' %}active{% endif %}" href="/topology_viz">Fabric View</a>
                    <a class="nav-link {% if request.path == '/traffic' %}active{% endif %}" href="/traffic">Traffic</a>
                    <a class="nav-link {% if request.path == '/faults' %}active{% endif %}" href="/faults">Faults</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function apiCall(url, method='GET', body=null) {
            const opts = { method, headers: {'Content-Type': 'application/json'} };
            if (body) opts.body = JSON.stringify(body);
            const resp = await fetch(url, opts);
            return resp.json();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
